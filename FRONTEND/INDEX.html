<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fake News Detector</title>

    <!-- LINK TO CUSTOM STYLESHEET -->
    <link rel="stylesheet" href="STYLE.css" />

    <!-- GOOGLE FONT FOR TYPOGRAPHY -->
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- BACKGROUND VIDEO LAYER -->
    <video autoplay muted loop playsinline id="background-video">
      <source
        src="C:\FAKE NEWS DETECTION\FRONTEND\BACKGROUND\background.mp4"
        type="video/mp4"
      />
    </video>

    <!-- MAIN CONTAINER -->
    <div class="overlay">
      <nav class="navbar">
        <div class="logo">🕵️‍♂️ FAKE NEWS DETECTOR</div>
        <div class="nav-toggle">&#9776;</div>
      </nav>

      <!-- HEADER CONTENT -->
      <section class="hero">
        <h1>DETECT FAKE NEWS<br /><span class="highlight">INSTANTLY</span></h1>
        <textarea
          placeholder="Paste your news article here..."
          id="newsInput"
        ></textarea>
        <button id="analyzeBtn">ANALYZE</button>
        <div id="resultContainer" class="hidden"></div>
      </section>

      <!-- SCROLL HINT -->
      <div class="scroll-indicator">▼</div>
    </div>

    <!-- SCRIPT -->
    <script src="SCRIPT.js"></script>
  </body>
</html>
