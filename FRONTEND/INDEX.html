<!DOCTYPE html>
<!-- DECLARES THE DOCUMENT TYPE AND HTML VERSION -->

<html lang="en">
  <!-- ROOT HTML ELEMENT, LANGUAGE SET TO ENGLISH -->

  <head>
    <!-- HEAD SECTION: CONTAINS META INFORMATION, TITLE, AND LINKS TO RESOURCES -->

    <meta charset="UTF-8" />
    <!-- DEFINES CHARACTER ENCODING AS UTF-8 FOR UNIVERSAL CHARACTER SUPPORT -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- MAKES THE WEBSITE RESPONSIVE ON ALL DEVICES -->

    <title>FAKE NEWS DETECTOR</title>
    <!-- TITLE OF THE WEBSITE SHOWN IN THE BROWSER TAB -->

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="BACKGROUND/DaRkSouL.png" />
    <!-- SETS THE WEBSITE'S ICON IN THE BROWSER TAB -->

    <!-- GOOGLE FONTS & ICONS -->
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <!-- IMPORTS THE 'ORBITRON' FONT FROM GOOGLE FONTS FOR STYLISH HEADINGS AND TEXT -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <!-- IMPORTS FONT AWESOME ICONS FOR USE THROUGHOUT THE SITE -->

    <!-- STYLES: IMPORT ALL CSS MODULES IN ORDER -->

    <!-- 1. BASE STYLES: RESET, TYPOGRAPHY, SPACING, HERO -->
    <link rel="stylesheet" href="CSS/BASE/STYLE_BASE.css" />
    <link rel="stylesheet" href="CSS/BASE/SPACING_UTILS.css" />
    <link rel="stylesheet" href="CSS/BASE/HERO.css" />

    <!-- 2. LAYOUT STYLES: NAVBAR, PAGE STRUCTURE, RESPONSIVE -->
    <link rel="stylesheet" href="CSS/LAYOUT/STYLE_LAYOUT.css" />
    <link rel="stylesheet" href="CSS/LAYOUT/LAYOUT_NAVBAR.css" />
    <link rel="stylesheet" href="CSS/LAYOUT/LAYOUT_RESPONSIVE.css" />

    <!-- 3. COMPONENT STYLES: BUTTONS, TEXTAREA, CONTROLS -->
    <link rel="stylesheet" href="CSS/COMPONENT/COMPONENT_BUTTONS.css" />
    <link rel="stylesheet" href="CSS/COMPONENT/COMPONENT_CONFIDENCE_BAR.css" />
    <link rel="stylesheet" href="CSS/COMPONENT/COMPONENT_FEEDBACK_BUTTON.css" />
    <link
      rel="stylesheet"
      href="CSS/COMPONENT/COMPONENT_LOADER_ACCESSIBILITY.css"
    />
    <link rel="stylesheet" href="CSS/COMPONENT/COMPONENT_MIC_BUTTON.css" />
    <link rel="stylesheet" href="CSS/COMPONENT/COMPONENT_MODEL_SELECT.css" />
    <link rel="stylesheet" href="CSS/COMPONENT/COMPONENT_TEXTAREA.css" />

    <!-- 4. EXPLANATION/RESULT STYLES -->
    <link
      rel="stylesheet"
      href="CSS/EXPLANATION/COMPONENT_EXPLANATION_AREA.css"
    />
    <link
      rel="stylesheet"
      href="CSS/EXPLANATION/COMPONENT_EXPLANATION_BUTTONS.css"
    />
    <link
      rel="stylesheet"
      href="CSS/EXPLANATION/COMPONENT_EXPLANATION_COLLAPSE.css"
    />
    <link
      rel="stylesheet"
      href="CSS/EXPLANATION/COMPONENT_RESULT_CONTAINER.css"
    />

    <!-- 5. MODAL STYLES -->
    <link rel="stylesheet" href="CSS/MODALS/COMPONENT_MODAL_FEEDBACK.css" />
    <link rel="stylesheet" href="CSS/MODALS/COMPONENT_MODAL_FORM.css" />
    <link rel="stylesheet" href="CSS/MODALS/COMPONENT_MODAL_BUTTONS.css" />

    <!-- 6. ANIMATIONS (KEYFRAMES) -->
    <link rel="stylesheet" href="CSS/THEME/ANIMATION.css" />

    <!-- 7. THEME STYLES (ALWAYS LAST TO OVERRIDE) -->
    <link rel="stylesheet" href="CSS/THEME/THEME_LIGHT_BASE.css" />
    <link rel="stylesheet" href="CSS/THEME/THEME_LIGHT_LAYOUT.css" />
    <link rel="stylesheet" href="CSS/THEME/THEME_LIGHT_COMPONENTS.css" />
    <link rel="stylesheet" href="CSS/THEME/THEME_LIGHT_EXPLANATION.css" />
    <link rel="stylesheet" href="CSS/THEME/THEME_LIGHT_MODALS.css" />
  </head>

  <body>
    <!-- BODY SECTION: CONTAINS ALL VISIBLE CONTENT AND STRUCTURE -->

    <!-- BACKGROUND VIDEO LAYER -->
    <video autoplay muted loop playsinline id="background-video">
      <!-- PLAYS A LOOPING, MUTED BACKGROUND VIDEO FOR A MODERN VISUAL EFFECT -->
      <source src="BACKGROUND/DaRkSouL.mp4" type="video/mp4" />
      <!-- PROVIDES THE VIDEO FILE (USE RELATIVE PATH FOR DEPLOYMENT) -->
      YOUR BROWSER DOES NOT SUPPORT THE VIDEO TAG.
      <!-- FALLBACK TEXT IF VIDEO IS NOT SUPPORTED -->
    </video>

    <!-- MAIN CONTAINER OVERLAYING THE VIDEO -->
    <div class="overlay">
      <!-- OVERLAY PROVIDES THE MAIN UI LAYER ABOVE THE VIDEO -->

      <!-- NAVIGATION BAR -->
      <nav class="navbar" aria-label="Main navigation">
        <!-- FLEX NAVBAR FOR LOGO, MENU, AND CONTROLS -->
        <div class="logo">🕵️‍♂️ FAKE NEWS DETECTOR</div>
        <!-- LOGO AND APP NAME -->

        <button
          class="nav-toggle"
          id="navToggle"
          aria-label="OPEN NAVIGATION MENU"
          aria-controls="navControls"
          aria-expanded="false"
        >
          &#9776;
        </button>
        <!-- HAMBURGER BUTTON FOR MOBILE NAVIGATION, ACCESSIBLE WITH ARIA ATTRIBUTES -->

        <div class="nav-controls" id="navControls">
          <!-- NAVIGATION CONTROLS: MODEL SELECTOR AND THEME TOGGLE -->
          <button id="themeToggle" aria-label="TOGGLE THEME">
            <i class="fas fa-moon"></i>
          </button>
          <!-- BUTTON TO TOGGLE BETWEEN DARK AND LIGHT THEMES -->
        </div>
      </nav>

      <!-- HEADER CONTENT SECTION -->
      <section class="hero">
        <!-- HERO SECTION FOR MAIN CALL TO ACTION AND INPUT AREA -->

        <h1>DETECT FAKE NEWS<br /><span class="highlight">INSTANTLY</span></h1>
        <!-- MAIN TITLE WITH HIGHLIGHTED KEYWORD -->

        <div class="model-select-row">
          <!-- MODEL SELECTION DROPDOWN ROW, PLACED ABOVE HEADLINE AND TEXTAREA -->
          <select id="modelSelect">
            <!-- DROPDOWN TO SELECT ML MODEL -->
            <option value="LOGISTIC">LOGISTIC</option>
            <option value="LSTM">LSTM</option>
            <option value="CNN">CNN</option>
            <option value="DNN">DNN</option>
            <option value="NAIVE_BAYES">NAIVE BAYES</option>
            <option value="RANDOM_FOREST">RANDOM FOREST</option>
          </select>
        </div>
        <!-- END MODEL SELECTION ROW -->

        <div class="textarea-container">
          <!-- CONTAINER FOR TEXTAREA AND MICROPHONE BUTTON, POSITIONED RELATIVE FOR OVERLAP EFFECT -->
          <div class="textarea-box">
            <!-- BLACK ROUNDED BOX FOR TEXTAREA, ADDS GLOW AND BACKGROUND -->
            <textarea
              placeholder="PASTE YOUR NEWS ARTICLE HERE..."
              id="newsInput"
              aria-label="NEWS ARTICLE INPUT"
            ></textarea>
            <!-- TEXTAREA FOR USER TO INPUT/PASTE NEWS ARTICLE -->
            <button
              id="clearNewsBtn"
              class="clear-news-btn"
              type="button"
              aria-label="CLEAR NEWS INPUT"
            >
              <i class="fas fa-times"></i>
            </button>
            <button
              id="micBtn"
              class="mic-button"
              aria-label="VOICE INPUT"
              type="button"
            >
              <span class="mic-circle">
                <i class="fas fa-microphone"></i>
              </span>
            </button>
            <!-- BUTTON TO ENABLE VOICE INPUT USING MICROPHONE, GLOWING CIRCLE OVERLAPPING BOX -->
          </div>
        </div>
        <!-- END TEXTAREA CONTAINER -->

        <div class="action-buttons">
          <button id="analyzeBtn" class="button">ANALYZE</button>
        </div>
        <!-- BUTTON TO SUBMIT THE NEWS ARTICLE FOR ANALYSIS -->

        <div
          id="resultContainer"
          class="hidden"
          aria-live="polite"
          aria-atomic="true"
        >
          <!-- PREDICTION AND CONFIDENCE TEXT GOES HERE -->
          <div id="resultText"></div>
          <!-- CONFIDENCE BAR ALWAYS PRESENT FOR JS TO RENDER INTO -->
          <div id="confidenceBarWrapper" class="confidence-bar-wrapper"></div>
        </div>
        <!-- CONTAINER TO DISPLAY THE FAKE/REAL RESULT AND CONFIDENCE, WITH ARIA ATTRIBUTES FOR ACCESSIBILITY -->

        <!-- EXPLANATION AREA: STYLED CONTAINER FOR EXPLANATION BOX AND OVERLAPPING COPY BUTTON -->
        <div class="explanation-area">
          <div class="explanation-box-container" id="explanationBoxContainer">
            <!-- STYLED CONTAINER FOR EXPLANATION BOX -->
            <label for="explanationBox" class="explanation-label"
              ><strong>EXPLANATION:</strong></label
            >
            <div id="explanationLoader" class="explanation-loader hidden"></div>
            <textarea
              id="explanationBox"
              class="explanation-box"
              readonly
              rows="4"
              aria-label="AI-GENERATED FACTUALITY EXPLANATION"
              placeholder="EXPLANATION WILL APPEAR HERE AFTER ANALYSIS..."
            ></textarea>
            <!-- OVERLAPPING COPY BUTTON AS AN ICON, CUTTING INTO THE EXPLANATION BOX -->
            <button
              id="copyExplanationBtn"
              class="copy-explanation-btn"
              type="button"
              aria-label="COPY EXPLANATION"
            >
              <i class="fas fa-copy"></i>
            </button>
            <!-- CLEAR BUTTON FOR EXPLANATION -->
            <button
              id="clearExplanationBtn"
              class="clear-explanation-btn"
              type="button"
              aria-label="CLEAR EXPLANATION"
            >
              <i class="fas fa-times"></i>
            </button>
          </div>
          <!-- EXPAND/COLLAPSE TOGGLE BUTTON FOR EXPLANATION -->
          <button
            id="toggleExplanationBtn"
            class="toggle-explanation-btn"
            type="button"
            aria-label="EXPAND/COLLAPSE EXPLANATION"
          >
            <i class="fas fa-chevron-up"></i>
          </button>
        </div>
        <!-- END EXPLANATION AREA -->
      </section>

      <!-- SCROLL HINT -->
      <div class="scroll-indicator" aria-hidden="true">▼</div>
      <!-- DECORATIVE SCROLL INDICATOR TO ENCOURAGE USERS TO SCROLL DOWN -->
    </div>

    <!-- FEEDBACK BUTTON FLOATING AT BOTTOM RIGHT -->
    <button
      id="feedbackToggle"
      class="button feedback-button"
      aria-label="OPEN FEEDBACK FORM"
    >
      <i class="fas fa-comment-dots"></i>
    </button>
    <!-- BUTTON TO OPEN THE FEEDBACK MODAL -->

    <!-- FEEDBACK MODAL DIALOG -->
    <div
      id="feedbackModal"
      class="hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="feedbackModalTitle"
      aria-describedby="feedbackModalDesc"
      tabindex="-1"
    >
      <div class="modal-content">
        <!-- MODAL CONTENT WRAPPER -->
        <h2 id="feedbackModalTitle">SHARE YOUR FEEDBACK</h2>
        <!-- MODAL TITLE -->

        <div id="feedbackModalDesc" class="visually-hidden">
          Please rate your satisfaction, tell us what you liked, and suggest
          improvements.
        </div>
        <!-- HIDDEN DESCRIPTION FOR SCREEN READERS -->

        <label for="rating"
          >SATISFACTION (1–5):
          <input type="range" min="1" max="5" id="rating" />
        </label>
        <!-- RANGE INPUT FOR SATISFACTION RATING -->

        <textarea
          placeholder="WHAT DID YOU LIKE?"
          id="feedbackLike"
          aria-label="WHAT DID YOU LIKE?"
        ></textarea>
        <!-- TEXTAREA FOR POSITIVE FEEDBACK -->

        <textarea
          placeholder="WHAT CAN BE IMPROVED?"
          id="feedbackImprove"
          aria-label="WHAT CAN BE IMPROVED?"
        ></textarea>
        <!-- TEXTAREA FOR SUGGESTIONS/IMPROVEMENTS -->

        <div class="modal-buttons">
          <button id="submitFeedback" class="button modal-btn">SUBMIT</button>
          <button id="closeModal" class="button modal-btn">CANCEL</button>
        </div>
        <!-- BUTTONS TO SUBMIT OR CANCEL FEEDBACK -->
      </div>
    </div>

    <!-- SCRIPT -->
    <script src="JS/CORE_ELEMENTS.js" defer></script>
    <script src="JS/EXPLANATION_AREA.js" defer></script>
    <script src="JS/THEME_MANAGER.js" defer></script>
    <script src="JS/VOICE_INPUT.js" defer></script>
    <script src="JS/UI_HELPERS.js" defer></script>
    <script src="JS/ANALYSIS_HANDLER.js" defer></script>
    <script src="JS/FEEDBACK_MODAL.js" defer></script>
    <script src="JS/MOBILE_NAV.js" defer></script>
    <script
      src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"
      defer
    ></script>
    <!-- LINKS THE JAVASCRIPT FILE FOR ALL INTERACTIVITY -->
  </body>
</html>
